# One weekly pull request for npm (the workspaces share one lockfile) and one monthly
# for GitHub Actions. `npm run check` in CI decides whether an update lands.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ["*"]
    ignore:
      # A vendor release can add tools, and porkbun's policy stops the server on a tool it has not
      # classified, so this one is bumped by hand with its classification (servers/porkbun/README.md).
      - dependency-name: "@porkbunllc/mcp-server"
      # The types follow the oldest Node the packages accept (engines), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
