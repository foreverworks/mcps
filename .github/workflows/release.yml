name: release

# Publishes to npm with provenance, then to the official MCP Registry:
# scripts/release.ts says what, docs/releasing.md says when and how. Started by
# hand, or by pushing a tag `release-<date>` on main once the versions are bumped.
# Started by hand with `rehearse`, it runs everything up to the publish and
# sends nothing, even while the repository is private.
on:
  workflow_dispatch:
    inputs:
      rehearse:
        description: Rehearse the release, publishing nothing
        type: boolean
        default: false
  push:
    tags: ["release-*"]

# Never two releases at once, and never one cut short by the next.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rehearse:
    if: ${{ inputs.rehearse }}
    # Outside the `release` environment, which a private repository on the
    # free plan cannot have, and with nothing to publish with but the
    # registry key, which it only logs in with.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare-release
      - run: npx tsx scripts/release.ts rehearse
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}

  publish:
    # Nothing is published while the repository is private: npm provenance
    # needs a public repository, and going public is the maintainer's switch.
    # Each package also stays out until its own `"private": true` is removed.
    if: ${{ !github.event.repository.private && !inputs.rehearse }}
    # GitHub-hosted only: npm trusted publishing does not accept self-hosted runners.
    runs-on: ubuntu-latest
    # The environment npm's trusted publisher names; give it required reviewers
    # to make every release wait for a person.
    environment: release
    timeout-minutes: 30
    permissions:
      # The GitHub release that carries the desktop bundles.
      contents: write
      # npm trusted publishing (OIDC) and the provenance statement.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare-release
      - run: npx tsx scripts/release.ts publish
        env:
          # Only for a package's first publish, which trusted publishing cannot
          # make; delete the secret once each package trusts this workflow.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
      # A tag's GitHub release carries every public server's bundle, so each
      # README's link to the newest release finds one.
      - name: Attach the bundles to the release
        if: startsWith(github.ref, 'refs/tags/release-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          bundles=(bundles/*.mcpb)
          if [ ${#bundles[@]} -eq 0 ]; then echo "no public server, no bundle"; exit 0; fi
          gh release create "$GITHUB_REF_NAME" "${bundles[@]}" --title "$GITHUB_REF_NAME" \
            --notes "What changed is in each package's CHANGELOG.md. Each .mcpb is a server's desktop bundle: open it in Claude Desktop."
