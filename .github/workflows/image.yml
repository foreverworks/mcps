name: image

# Builds the container image (the Dockerfile at the root: every server, one per
# container) and publishes it to GitHub's registry as ghcr.io/<repository>,
# tagged with the full commit and, while the commit is still the head of main,
# `main`. docs/deploying.md, "In a container", says how it is used.
#
# It runs when `ci` has finished on a push to main and passed, so a main that
# fails its checks is never published; and by hand, from main, to publish again
# (a new base image, say). A pull request, a fork or another branch never gets
# past the condition on the job below.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Two publishes at once could finish out of order; one waits for the other.
concurrency:
  group: image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.repository_owner == 'foreverworks' && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      )
    # GitHub-hosted: this repository is public, so its runners are free.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      # The commit ci checked, or, by hand, the one dispatched.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      # `main` follows the head of main: a commit whose ci finished after a
      # newer push's must not move it back.
      - name: Choose the tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags="$IMAGE:$SHA"
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$SHA" ]; then
            tags="$tags"$'\n'"$IMAGE:main"
          fi
          { echo 'list<<TAGS'; echo "$tags"; echo 'TAGS'; } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The checked-out tree, not the repository's default Git context.
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}

      - name: Say what was published
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          {
            echo "### Image published"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "Pull it pinned: \`$IMAGE@$DIGEST\`"
            echo
            echo "Tags:"
            echo "$TAGS" | sed 's/.*/- `&`/'
          } >> "$GITHUB_STEP_SUMMARY"
