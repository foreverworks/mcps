name: image

# Builds the container image (the Dockerfile at the root: every server, one per
# container) and publishes it to GitHub's registry as ghcr.io/<repository>,
# tagged with the full commit and, while the commit is still the head of main,
# `main`. Beside it, into the same package, go three more builds of the same
# Dockerfile: `printer` (the image plus poppler, which the printer server runs),
# tagged `<full commit>-printer`, after pdftoppm and pdfinfo have been run in it,
# `anafspv` (the image plus a Java runtime, which the anaf-spv server runs),
# tagged `<full commit>-anafspv`, after `java -version` has been run in it, and
# `devices` (the image plus an ssh client, bash, the Incus client, jq, awk and
# setsid, which the devices server and its hosts' control commands run), tagged
# `<full commit>-devices`, after each of them has been run in it.
# docs/deploying.md, "In a container", says how they are used.
#
# It runs when `ci` has finished on a push to main and passed, so a main that
# fails its checks is never published; and by hand, from main, to publish again
# (a new base image, say). A pull request, a fork or another branch never gets
# past the condition on the job below.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Two publishes at once could finish out of order; one waits for the other.
concurrency:
  group: image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.repository_owner == 'foreverworks' && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      )
    # GitHub-hosted: this repository is public, so its runners are free.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      # The commit ci checked, or, by hand, the one dispatched.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      # `main` follows the head of main: a commit whose ci finished after a
      # newer push's must not move it back.
      - name: Choose the tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags="$IMAGE:$SHA"
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$SHA" ]; then
            tags="$tags"$'\n'"$IMAGE:main"
          fi
          { echo 'list<<TAGS'; echo "$tags"; echo 'TAGS'; } >> "$GITHUB_OUTPUT"
          echo "printer=$IMAGE:$SHA-printer" >> "$GITHUB_OUTPUT"
          echo "anafspv=$IMAGE:$SHA-anafspv" >> "$GITHUB_OUTPUT"
          echo "devices=$IMAGE:$SHA-devices" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The checked-out tree, not the repository's default Git context.
          context: .
          # Named, though it is also the Dockerfile's last stage: what a stage
          # added above it does must never change this image.
          target: image
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}

      # The printer build is run before it is published: a poppler that does
      # not start in it fails the job, and nothing is pushed under its tag.
      # The second build below finds every layer of this one in the builder's cache.
      - name: Build the printer image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: printer
          load: true
          tags: mcps-printer-check
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}

      - name: Check that poppler runs in the printer image
        run: |
          docker run --rm --entrypoint pdftoppm mcps-printer-check -v
          docker run --rm --entrypoint pdfinfo mcps-printer-check -v

      - name: Push the printer image
        id: build-printer
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: printer
          push: true
          tags: ${{ steps.tags.outputs.printer }}
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}

      # The same for anaf-spv's build: a Java runtime that does not start in
      # it fails the job, and nothing is pushed under its tag.
      - name: Build the anaf-spv image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: anafspv
          load: true
          tags: mcps-anafspv-check
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}

      - name: Check that Java runs in the anaf-spv image
        run: docker run --rm --entrypoint java mcps-anafspv-check -version

      - name: Push the anaf-spv image
        id: build-anafspv
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: anafspv
          push: true
          tags: ${{ steps.tags.outputs.anafspv }}
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}

      # The same for the devices build: a program the server or a control
      # command runs that is missing from it fails the job, and nothing is
      # pushed under its tag.
      - name: Build the devices image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: devices
          load: true
          tags: mcps-devices-check
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}

      - name: Check that the devices image has what the server runs
        run: |
          docker run --rm --entrypoint ssh mcps-devices-check -V
          docker run --rm --entrypoint incus mcps-devices-check --version
          docker run --rm --entrypoint jq mcps-devices-check --version
          docker run --rm --entrypoint bash mcps-devices-check --version
          docker run --rm --entrypoint setsid mcps-devices-check --version
          docker run --rm --entrypoint awk mcps-devices-check -W version

      - name: Push the devices image
        id: build-devices
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: devices
          push: true
          tags: ${{ steps.tags.outputs.devices }}
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}

      - name: Say what was published
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.list }}
          PRINTER_DIGEST: ${{ steps.build-printer.outputs.digest }}
          PRINTER_TAG: ${{ steps.tags.outputs.printer }}
          ANAFSPV_DIGEST: ${{ steps.build-anafspv.outputs.digest }}
          ANAFSPV_TAG: ${{ steps.tags.outputs.anafspv }}
          DEVICES_DIGEST: ${{ steps.build-devices.outputs.digest }}
          DEVICES_TAG: ${{ steps.tags.outputs.devices }}
        run: |
          {
            echo "### Image published"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "Pull it pinned: \`$IMAGE@$DIGEST\`"
            echo
            echo "Tags:"
            echo "$TAGS" | sed 's/.*/- `&`/'
            echo
            echo "### Printer image published"
            echo
            echo "Digest: \`$PRINTER_DIGEST\`"
            echo
            echo "Pull it pinned: \`$IMAGE@$PRINTER_DIGEST\`"
            echo
            echo "Tag: \`$PRINTER_TAG\`"
            echo
            echo "### anaf-spv image published"
            echo
            echo "Digest: \`$ANAFSPV_DIGEST\`"
            echo
            echo "Pull it pinned: \`$IMAGE@$ANAFSPV_DIGEST\`"
            echo
            echo "Tag: \`$ANAFSPV_TAG\`"
            echo
            echo "### devices image published"
            echo
            echo "Digest: \`$DEVICES_DIGEST\`"
            echo
            echo "Pull it pinned: \`$IMAGE@$DEVICES_DIGEST\`"
            echo
            echo "Tag: \`$DEVICES_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
