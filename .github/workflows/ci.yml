name: ci

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes an in-flight run: nothing here deploys, so there is
# no reason to finish checking a commit that is already history.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # GitHub-hosted. The job needs node and npm, and a throwaway Postgres with
    # pgvector (pinned to the version the SQL was tested on) for the one test that
    # runs the rag server's SQL; no secret.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node the packages accept (engines), the previous LTS, and the
        # current LTS (26 became LTS on 2026-10-28), which the repo builds on.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          # The release tags, which scripts/access-changes.ts compares against.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # typecheck, then tests, then build, across every workspace, then the
      # checks that hold the docs and the packages to the code. The rag
      # server's store test (servers/rag/test/store.pg.test.ts) runs against
      # the service above: it makes a database of its own there and drops it.
      - run: npm run check
        env:
          RAG_TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/postgres
      # Every tool whose access class changed since the last release is told
      # in a changeset or the changelog (.changeset/README.md). Needs git, so
      # it is not part of npm run check.
      - run: npx tsx scripts/access-changes.ts --check

  bundles:
    # The desktop bundle of every server that ships (every audience but the
    # extras), built and checked by the mcpb CLI the way a release builds it,
    # so a release cannot fail on one. Nothing is published.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsx scripts/bundle.ts --out bundles

  image:
    # Every stage the image workflow publishes, built from this commit and pushed
    # nowhere, then started the way that workflow starts it before a publish
    # (.github/scripts/image-start-check.sh: the server answers over stdio, and
    # each program a stage adds runs), so a change to the Dockerfile or its base
    # image (Renovate's base bumps merge on their own once ci passes) proves it
    # builds and starts before it merges, not after.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and start image, printer, anafspv and devices
        run: |
          set -euo pipefail
          for target in image printer anafspv devices; do
            echo "::group::${target}"
            docker buildx build --target "$target" --load --tag "mcps-${target}-check" .
            .github/scripts/image-start-check.sh "$target" "mcps-${target}-check"
            echo "::endgroup::"
          done
